[Rainmeter]
Update=1000
DynamicWindowSize=1

[Variables]
SITEURL=https://tcbonepiecechapters.com

MangaHref=<a class="text-white text-lg font-bold" href="(.*)".*>
MangaName=.*(.*)</a>
MangaChapter=.*<div>(.*)</div>
DateUpdate=.*<time-ago.*>(.*)</time-ago>
SubstituteFeed="&#39;":"'","&amp;":"&","&quot;":'"',"&lt;":"<","&gt;":">"
Data=#MangaHref##MangaName##MangaChapter##DateUpdate#

Font=JetBrains Mono
FL_FontColor=255,0,255,255
SL_FontColor=0,255,255,255

FirstLineFontSize=9
FirstLineX=20
FirstLineY=0
FL_RelativeSpacingY=26r

SecondLineFontSize=8
SecondLineItem1X=#FirstLineX#
SecondLineItem2X=(105+#SecondLineItem1X#)
SecondLineY=13
SL_RelativeSpacingY=26r

WidgetSizeX=370
WidgetSizeY=105
WidgetInteriorOffsetX=1
WidgetInteriorOffsetY=1
ForeGround2SizeY=26
ForeGroundSizeY=25

[TCBScans]
Measure=Plugin
Plugin=Plugins\WebParser.dll
UpdateRate=1000
Url=#SITEURL#
RegExp=(?siU)#Data#.*#Data#.*#Data#.*#Data#
RegExpSubstitute=1
Substitute=#SubstituteFeed#

[BG]
Meter=Image
x=0
y=0
h=#WidgetSizeY#
w=#WidgetSizeX#
Solidcolor=0,0,0,220

[FG1]
Meter=Image
x=#WidgetInteriorOffsetX#
y=#WidgetInteriorOffsetY#
h=#ForeGroundSizeY#
w=(#WidgetSizeX#-2*#WidgetInteriorOffsetX#)
Solidcolor=255,255,255,65

[FG2]
Meter=Image
x=#WidgetInteriorOffsetX#
y=(#ForeGround2SizeY#+#WidgetInteriorOffsetY#)
h=#ForeGroundSizeY#
w=(#WidgetSizeX#-2*#WidgetInteriorOffsetX#)
Solidcolor=255,255,255,40

[FG3]
Meter=Image
MeterStyle=FG1
y=26r

[FG4]
Meter=Image
MeterStyle=FG2
y=26r

[Rect]
Meter=Shape
y=(#WidgetInteriorOffsetY#+8)
x=6
Shape=Rectangle 0,0,7,7,2,2 | Extend MySharedModifiers
MySharedModifiers=Fill Color 255,255,255,255 | StrokeWidth 2 | Stroke Color 0,0,0,255
LeftMouseUpAction=["#SITEURL#[MangaURL1]"]
DynamicVariables=1
ClipString=1
AntiAlias=1

[Rect2]
Meter=Shape
y=26r
LeftMouseUpAction=["#SITEURL#[MangaURL2]"]
MeterStyle=Rect
[Rect3]
Meter=Shape
y=26r
LeftMouseUpAction=["#SITEURL#[MangaURL3]"]
MeterStyle=Rect
[Rect4]
Meter=Shape
y=26r
LeftMouseUpAction=["#SITEURL#[MangaURL4]"]
MeterStyle=Rect


