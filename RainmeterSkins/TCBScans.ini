;-- Manga Name and Chapter Number

[MeterName1]
MeasureName=MangaNameChapNum1
Meter=STRING
X=#FirstLineX#
Y=#FirstLineY#
FontWeight=950
StringEffect=Border
FontEffectColor=0,0,0,255
FontColor=#FL_FontColor#
FontSize=#FirstLineFontSize#
StringAlign=LeftTop
FontFace=#Font#
Antialias=1

[MeterName2]
MeasureName=MangaNameChapNum2
Meter=STRING
Y=#FL_RelativeSpacingY#
MeterStyle=MeterName1

[MeterName3]
MeasureName=MangaNameChapNum3
Meter=STRING
Y=#FL_RelativeSpacingY#
MeterStyle=MeterName1

[MeterName4]
MeasureName=MangaNameChapNum4
Meter=STRING
Y=#FL_RelativeSpacingY#
MeterStyle=MeterName1

; -- Chapter Title

[MeterTitle1]
MeasureName=MangaTitle1
Meter=STRING
X=#SecondLineItem2X#
Y=#SecondLineY#
FontWeight=500
StringEffect=Border
FontEffectColor=0,0,0,255
FontColor=#SL_FontColor#
FontSize=#SecondLineFontSize#
StringAlign=LEFT
FontFace=#Font#
Antialias=1
InlineSetting=Color | 255,255,255,255
InlinePattern=Title:
Text=Title:%1
;Prefix="Title:"

[MeterTitle2]
MeasureName=MangaTitle2
Meter=STRING
Y=#SL_RelativeSpacingY#
MeterStyle=MeterTitle1

[MeterTitle3]
MeasureName=MangaTitle3
Meter=STRING
Y=#SL_RelativeSpacingY#
MeterStyle=MeterTitle1

[MeterTitle4]
