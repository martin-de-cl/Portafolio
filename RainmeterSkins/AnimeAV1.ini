Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[AnimeInfo]
StringIndex=12
Substitute=#SubstituteFeed#
[AnimeURL4]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[AnimeInfo]
StringIndex=16
Substitute=#SubstituteFeed#

