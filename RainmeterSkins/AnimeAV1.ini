[Rainmeter]
Update=1000
DynamicWindowSize=1
DynamicVariables=1

[Variables]
SITEURL=https://animeav1.com

; RegExp made simple

UploadTime=<span class="from-soft text-subs absolute.*>(.*)</span>
EpisodeNum=.*<span class="text-lead font-bold">(.*)</span>
AnimeName=.*<div class="text-2xs text-subs font-bold uppercase">(.*)</div>
AnimeHREF=.*<a class="absolute inset-0 z-20 grid place-content-center" href="(.*)">
SubstituteFeed="&#39;":"'","&amp;":"&","&quot;":'"',"&lt;":"<","&gt;":">"
Data=#UploadTime##EpisodeNum##AnimeName##AnimeHREF#

WidgetSizeX=370
WidgetSizeY=105
WidgetInteriorOffsetX=1
WidgetInteriorOffsetY=1
ForeGroundSizeY=25
ForeGround2SizeY=26

Font=JetBrains Mono

TabsMaxSize=2
TabsCurrentPosition=1

BackgroundColor=0,0,0,220
BackgroundPositionY=0
BackgroundPositionX=0
ForegroundColor1=255,255,255,65
ForegroundColor2=255,255,255,40
ForeGroundRelativeSpacingY=26r

FirstLineX=20
FirstLineY=0
FirstLineRelativeSpacingY=26r
FirstLineFontSize=9
FirstLineFontWeight=0
FirstLineFontColor=0,255,255,255
FirstLineFontBorderColor=0,0,0,255

SecondLineY=13
SecondLineItem1X=#FirstLineX#
SecondLineItem2X=(160+#FirstLineX#)
SecondLineRelativeSpacingY=26r
SecondLineFontSize=8
SecondLineFontWeight=0
SecondLineLabelFontColor=255,255,255,255
SecondLineFontColor=255,0,255,255
SecondLineFontBorderColor=0,0,0,255

BulletCoordinatesX=6
BulletCoordinatesY=(#WidgetInteriorOffsetY#+8)
BulletPointMouseOverOn=255,0,255,255
BulletPointMouseOverOff=255,255,255,255
BulletPointBorderColor=0,0,0,255
BulletPointShape=Rectangle 0,0,7,7,2,2
BulletPointBorderWidth=2
BulletPointRelativeSpacingY=26r

---------------------------------------------------------------------

;-- Fuentes de Informacion

[AnimeInfo]
Measure=Plugin
Plugin=Plugins\WebParser.dll
UpdateRate=#Update#
Url=#SITEURL#
RegExp=(?siU)#Data#.*#Data#.*#Data#.*#Data#
RegExpSubstitute=1
Substitute=#SubstituteFeed#

---------------------------------------------------------------------

;-- Measure Block 

[AnimeURL1]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[AnimeInfo]
StringIndex=4
Substitute=#SubstituteFeed#
