---------------------------------------------------------------------

;-- Begining: Construccion del Widget

;-- Widget container

[BG]
Meter=Image
x=#BackgroundPositionX#
y=#BackgroundPositionY#
h=#WidgetSizeY#
w=#WidgetSizeX#
Solidcolor=#BackgroundColor#

;- Container for information

[FG1]
Meter=Image
x=#WidgetInteriorOffsetX#
y=#WidgetInteriorOffsetY#
h=#ForeGroundSizeY#
w=(#WidgetSizeX#-2*#WidgetInteriorOffsetX#)
Solidcolor=#ForegroundColor1#
[FG2]
Meter=Image
x=#WidgetInteriorOffsetX#
y=(#ForeGround2SizeY#+#WidgetInteriorOffsetY#)
h=#ForeGroundSizeY#
w=(#WidgetSizeX#-2*#WidgetInteriorOffsetX#)
Solidcolor=#ForegroundColor2#
[FG3]
Meter=Image
MeterStyle=FG1
y=#ForeGroundRelativeSpacingY#
[FG4]
Meter=Image
MeterStyle=FG2
y=#ForeGroundRelativeSpacingY#

;-- Bullets points for Anime Links

[Rect]
Meter=Shape
y=#BulletCoordinatesY#
x=#BulletCoordinatesX#
Shape=#BulletPointShape# | Extend MySharedModifiers
MySharedModifiers=Fill Color #BulletPointMouseOverOff# | StrokeWidth #BulletPointBorderWidth# | Stroke Color #BulletPointBorderColor#
LeftMouseUpAction=["#SITEURL#[AnimeURL1]"]
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "#BulletPointShape# | Fill Color #BulletPointMouseOverOn# | StrokeWidth #BulletPointBorderWidth# | Stroke Color #BulletPointBorderColor#"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "#BulletPointShape# | Fill Color #BulletPointMouseOverOff# | StrokeWidth #BulletPointBorderWidth# | Stroke Color #BulletPointBorderColor#"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
DynamicVariables=1
ClipString=1
AntiAlias=1

[Rect2]
Meter=Shape
y=#BulletPointRelativeSpacingY#
LeftMouseUpAction=["#SITEURL#[AnimeURL2]"]
MeterStyle=Rect
[Rect3]
Meter=Shape
y=#BulletPointRelativeSpacingY#
LeftMouseUpAction=["#SITEURL#[AnimeURL3]"]
MeterStyle=Rect
[Rect4]
Meter=Shape
y=#BulletPointRelativeSpacingY#
LeftMouseUpAction=["#SITEURL#[AnimeURL4]"]
MeterStyle=Rect

;-- Anime Name and Episode Number

[MeterName1]
MeasureName=AnimeName1
Meter=STRING
X=#FirstLineX#
Y=#FirstLineY#
W=(#WidgetSizeX#-30*#WidgetInteriorOffsetX#)
FontWeight=950
StringEffect=Border
FontEffectColor=#FirstLineFontBorderColor#
FontColor=#FirstLineFontColor#
FontSize=#FirstLineFontSize#
StringAlign=LeftTop
FontFace=#Font#
Antialias=1
ClipString=1

[MeterName2]
MeasureName=AnimeName2
Meter=STRING
Y=#FirstLineRelativeSpacingY#
MeterStyle=MeterName1
[MeterName3]
MeasureName=AnimeName3
Meter=STRING
Y=#FirstLineRelativeSpacingY#
MeterStyle=MeterName1
[MeterName4]
MeasureName=AnimeName4
Meter=STRING
Y=#FirstLineRelativeSpacingY#
MeterStyle=MeterName1

; -- Reselease Date

[MeterDate1]
MeasureName=AnimeReleaseDate1
Meter=STRING
X=#SecondLineItem1X#
Y=#SecondLineY#
StringCase=Proper
FontWeight=500
StringEffect=Border
FontEffectColor=#SecondLineFontBorderColor#
FontColor=#SecondLineFontColor#
FontSize=#SecondLineFontSize#
StringAlign=LEFT
FontFace=#Font#
Antialias=1
InlineSetting=Color | #SecondLineLabelFontColor#
InlinePattern=Date:
Prefix="Date:"

[MeterDate2]
MeasureName=AnimeReleaseDate2
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterDate1
[MeterDate3]
MeasureName=AnimeReleaseDate3
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterDate1
[MeterDate4]
MeasureName=AnimeReleaseDate4
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterDate1

; -- Chapter Title

[MeterTitle1]
MeasureName=AnimeTitle1
Meter=STRING
X=#SecondLineItem2X#
Y=#SecondLineY#
FontWeight=500
StringEffect=Border
FontEffectColor=#SecondLineFontBorderColor#
FontColor=#SecondLineFontColor#
FontSize=#SecondLineFontSize#
StringAlign=LEFT
FontFace=#Font#
Antialias=1
InlineSetting=Color | #SecondLineLabelFontColor#
InlinePattern=Episode:
Text=Episode:%1
DynamicVariables=1

[MeterTitle2]
MeasureName=AnimeTitle2
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterTitle1
[MeterTitle3]
MeasureName=AnimeTitle3
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterTitle1
[MeterTitle4]
MeasureName=AnimeTitle4
Meter=STRING
Y=#SecondLineRelativeSpacingY#
MeterStyle=MeterTitle1

;-- EOF
